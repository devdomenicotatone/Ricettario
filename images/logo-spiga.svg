<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradiente principale chicco -->
    <linearGradient id="grain-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="45%" stop-color="#C2884D"/>
      <stop offset="100%" stop-color="#8B5E3C"/>
    </linearGradient>
    <!-- Gradiente stelo -->
    <linearGradient id="stem-g" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#A0764A"/>
      <stop offset="100%" stop-color="#6B4226"/>
    </linearGradient>
    <!-- Gradiente chicco highlight -->
    <linearGradient id="grain-hi" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#E8C89E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#D4A574" stop-opacity="0"/>
    </linearGradient>
    <!-- Glow hover -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g class="spiga-group">
    <!-- ===== STELO PRINCIPALE ===== -->
    <path d="M32 58 C32 58, 31 42, 30.5 32 C30 22, 31 12, 32 8"
          stroke="url(#stem-g)" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Stelo rametto sinistro basso -->
    <path d="M31 40 C29 38, 24 36, 20 35"
          stroke="url(#stem-g)" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <!-- Stelo rametto destro basso -->
    <path d="M31.5 36 C33 34, 38 32, 42 31"
          stroke="url(#stem-g)" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <!-- Stelo rametto sinistro medio -->
    <path d="M31 30 C29 28, 25 27, 22 26.5"
          stroke="url(#stem-g)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <!-- Stelo rametto destro medio -->
    <path d="M31.5 26 C33 24.5, 37 23.5, 40 23"
          stroke="url(#stem-g)" stroke-width="1.2" stroke-linecap="round" fill="none"/>

    <!-- ===== CHICCHI — lato sinistro ===== -->
    <!-- Chicco S1 (basso sx) -->
    <ellipse cx="18" cy="34" rx="5" ry="2.8" transform="rotate(-35 18 34)" fill="url(#grain-g)"/>
    <ellipse cx="17.5" cy="33.3" rx="3.2" ry="1.6" transform="rotate(-35 17.5 33.3)" fill="url(#grain-hi)"/>

    <!-- Chicco S2 (medio sx) -->
    <ellipse cx="20.5" cy="26" rx="4.5" ry="2.5" transform="rotate(-30 20.5 26)" fill="url(#grain-g)"/>
    <ellipse cx="20" cy="25.4" rx="2.8" ry="1.4" transform="rotate(-30 20 25.4)" fill="url(#grain-hi)"/>

    <!-- Chicco S3 (alto sx) -->
    <ellipse cx="25" cy="19" rx="4" ry="2.2" transform="rotate(-25 25 19)" fill="url(#grain-g)"/>
    <ellipse cx="24.6" cy="18.4" rx="2.5" ry="1.3" transform="rotate(-25 24.6 18.4)" fill="url(#grain-hi)"/>

    <!-- ===== CHICCHI — lato destro ===== -->
    <!-- Chicco D1 (basso dx) -->
    <ellipse cx="44" cy="30" rx="5" ry="2.8" transform="rotate(35 44 30)" fill="url(#grain-g)"/>
    <ellipse cx="44.5" cy="29.3" rx="3.2" ry="1.6" transform="rotate(35 44.5 29.3)" fill="url(#grain-hi)"/>

    <!-- Chicco D2 (medio dx) -->
    <ellipse cx="41.5" cy="22.5" rx="4.5" ry="2.5" transform="rotate(30 41.5 22.5)" fill="url(#grain-g)"/>
    <ellipse cx="42" cy="21.9" rx="2.8" ry="1.4" transform="rotate(30 42 21.9)" fill="url(#grain-hi)"/>

    <!-- Chicco D3 (alto dx) -->
    <ellipse cx="37" cy="16" rx="4" ry="2.2" transform="rotate(25 37 16)" fill="url(#grain-g)"/>
    <ellipse cx="37.4" cy="15.4" rx="2.5" ry="1.3" transform="rotate(25 37.4 15.4)" fill="url(#grain-hi)"/>

    <!-- ===== CHICCO APICALE (punta) ===== -->
    <ellipse cx="31.5" cy="10" rx="3.5" ry="2" transform="rotate(-5 31.5 10)" fill="url(#grain-g)"/>
    <ellipse cx="31.2" cy="9.5" rx="2.2" ry="1.2" transform="rotate(-5 31.2 9.5)" fill="url(#grain-hi)"/>

    <!-- ===== ARISTE (barbe sottili) ===== -->
    <line x1="31.5" y1="8" x2="29" y2="3" stroke="#A0764A" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
    <line x1="32" y1="9" x2="35" y2="4" stroke="#A0764A" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
    <line x1="25" y1="18" x2="21" y2="14" stroke="#A0764A" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>
    <line x1="37" y1="15" x2="41" y2="11" stroke="#A0764A" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
