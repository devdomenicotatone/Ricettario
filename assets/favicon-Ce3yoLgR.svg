<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Sfondo scuro caldo -->
  <rect width="64" height="64" rx="14" fill="#4A3228"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13" fill="#5B3A2C"/>

  <defs>
    <linearGradient id="k" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFE4A0"/>
      <stop offset="40%" stop-color="#E8B44E"/>
      <stop offset="100%" stop-color="#C48A30"/>
    </linearGradient>
    <linearGradient id="s" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#D4A460"/>
      <stop offset="100%" stop-color="#8A6030"/>
    </linearGradient>
    <linearGradient id="h" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF0C0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8C070" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Spiga unica, grande e centrata -->
  <g transform="translate(32, 32)">
    <!-- Stelo principale - grosso -->
    <path d="M0 24 C0 18, 1 12, 2 6 C3 0, 5 -6, 8 -12 C10 -16, 12 -19, 14 -22" stroke="url(#s)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Foglioline laterali basse -->
    <path d="M0 20 C-4 18, -8 17, -11 18" stroke="#9A7A44" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M1 16 C5 14, 9 14, 12 15" stroke="#9A7A44" stroke-width="1.6" stroke-linecap="round" fill="none"/>

    <!-- Chicchi SX - grandi e luminosi -->
    <ellipse cx="-3" cy="10" rx="5.5" ry="3.2" transform="rotate(-40 -3 10)" fill="url(#k)"/>
    <ellipse cx="-3.5" cy="9.3" rx="3.0" ry="1.5" transform="rotate(-40 -3.5 9.3)" fill="url(#h)"/>

    <ellipse cx="-2" cy="3" rx="5.2" ry="3.0" transform="rotate(-35 -2 3)" fill="url(#k)"/>
    <ellipse cx="-2.5" cy="2.4" rx="2.8" ry="1.4" transform="rotate(-35 -2.5 2.4)" fill="url(#h)"/>

    <ellipse cx="0" cy="-4" rx="4.8" ry="2.8" transform="rotate(-28 0 -4)" fill="url(#k)"/>
    <ellipse cx="-0.4" cy="-4.5" rx="2.6" ry="1.3" transform="rotate(-28 -0.4 -4.5)" fill="url(#h)"/>

    <ellipse cx="3" cy="-10" rx="4.5" ry="2.6" transform="rotate(-20 3 -10)" fill="url(#k)"/>
    <ellipse cx="2.6" cy="-10.5" rx="2.4" ry="1.2" transform="rotate(-20 2.6 -10.5)" fill="url(#h)"/>

    <ellipse cx="7" cy="-15" rx="4.0" ry="2.3" transform="rotate(-10 7 -15)" fill="url(#k)"/>
    <ellipse cx="6.6" cy="-15.5" rx="2.1" ry="1.1" transform="rotate(-10 6.6 -15.5)" fill="url(#h)"/>

    <ellipse cx="11" cy="-19" rx="3.3" ry="2.0" transform="rotate(0 11 -19)" fill="url(#k)"/>
    <ellipse cx="10.6" cy="-19.4" rx="1.8" ry="0.9" transform="rotate(0 10.6 -19.4)" fill="url(#h)"/>

    <!-- Chicchi DX -->
    <ellipse cx="5" cy="8" rx="5.2" ry="3.1" transform="rotate(35 5 8)" fill="url(#k)"/>
    <ellipse cx="5.5" cy="7.3" rx="2.8" ry="1.4" transform="rotate(35 5.5 7.3)" fill="url(#h)"/>

    <ellipse cx="6" cy="1" rx="5.0" ry="2.9" transform="rotate(28 6 1)" fill="url(#k)"/>
    <ellipse cx="6.4" cy="0.4" rx="2.7" ry="1.3" transform="rotate(28 6.4 0.4)" fill="url(#h)"/>

    <ellipse cx="7.5" cy="-6" rx="4.6" ry="2.7" transform="rotate(22 7.5 -6)" fill="url(#k)"/>
    <ellipse cx="7.9" cy="-6.5" rx="2.5" ry="1.2" transform="rotate(22 7.9 -6.5)" fill="url(#h)"/>

    <ellipse cx="10" cy="-12.5" rx="4.3" ry="2.5" transform="rotate(30 10 -12.5)" fill="url(#k)"/>
    <ellipse cx="10.4" cy="-13" rx="2.3" ry="1.15" transform="rotate(30 10.4 -13)" fill="url(#h)"/>

    <ellipse cx="13" cy="-17.5" rx="3.8" ry="2.2" transform="rotate(38 13 -17.5)" fill="url(#k)"/>
    <ellipse cx="13.4" cy="-18" rx="2.0" ry="1.0" transform="rotate(38 13.4 -18)" fill="url(#h)"/>

    <!-- Resta (punta in alto) -->
    <path d="M14 -22 C15.5 -25, 16.5 -27, 17 -29" stroke="#D4A460" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M14.5 -21 C17 -23, 19 -24, 20.5 -25" stroke="#D4A460" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
