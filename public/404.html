<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Il Ricettario</title>
    <script>
        // GitHub Pages SPA Redirect
        // Salva il path corrente e redireziona a index.html
        // Il router SPA leggerà sessionStorage e navigherà alla pagina giusta
        var pathSegmentsToKeep = 1; // "/Ricettario/" = 1 segmento base
        var l = window.location;
        sessionStorage.setItem(
            'spa-redirect',
            l.pathname + l.search + l.hash
        );
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/'
        );
    </script>
</head>
<body>
    <!-- GitHub Pages SPA Redirect — see https://github.com/rafgraph/spa-github-pages -->
</body>
</html>
